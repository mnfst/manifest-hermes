# Development only. The plugin itself has no dependencies and is installed with
# `hermes plugins install`, never with pip.
[project]
name = "manifest-hermes-dev"
version = "0.4.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

# Setuptools refuses to guess between several top-level modules; name them.
[tool.setuptools]
py-modules = ["manifest_heal", "manifest_tracking", "manifest_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
