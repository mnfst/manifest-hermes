[project]
name = "manifest-hermes"
version = "0.1.0"
description = "Hermes Agent plugin: repair rejected tool calls with Manifest."
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
dependencies = ["mnfst>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["manifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
