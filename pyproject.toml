# Development only. The plugin itself has no dependencies and is installed with
# `hermes plugins install`, never with pip.
[project]
name = "manifest-hermes-dev"
version = "0.2.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
