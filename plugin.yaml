name: manifest
version: 0.3.0
manifest_version: 2
api_version: 1
license: MIT
description: "Repair rejected tool calls: a corrected set of arguments comes back from Manifest and is applied on the retry."
author: Manifest
tags: [reliability, tools]
provides_hooks:
  - transform_tool_result
requires_env:
  - name: MNFST_KEY
    description: "Manifest project key (Project Settings, Autofix on)"
    url: "https://manifest.build"
    secret: true
