name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      # Hermes loads the plugin by copy, from its own directory.
      - run: python -c "import __init__"

  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml
      - name: Validate plugin.yaml
        run: |
          python - <<'PY'
          import sys, yaml
          m = yaml.safe_load(open("plugin.yaml"))
          missing = [k for k in ("name", "version", "manifest_version", "api_version", "description") if not m.get(k)]
          if missing:
              sys.exit(f"plugin.yaml is missing: {', '.join(missing)}")
          print(f"plugin.yaml OK: {m['name']} {m['version']}")
          PY
